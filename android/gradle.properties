org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# AGP 9's built-in Kotlin (P5.1-8). With it on, flutter_timezone and
# flutter_volume_controller no longer apply the old Kotlin Gradle Plugin
# themselves. Debug (with integration_test) and release builds were checked
# with it. Flutter still prints its "plugins that apply KGP" warning because
# it scans the plugins' build.gradle TEXT, where `apply plugin: 'kotlin-android'`
# sits inside an `if` that is now skipped; see README "Build health".
android.builtInKotlin=true
